<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>14-Day Sprint Schedule</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap');
:root{--bg:#0d0d0d;--surface:#161616;--surface2:#1e1e1e;--border:#2a2a2a;--text:#e8e8e8;--text-dim:#888;--accent:#00c9a7;--accent-dim:#00c9a720;--work:#f59e0b;--work-bg:#f59e0b18;--biz:#00c9a7;--biz-bg:#00c9a718;--health:#a78bfa;--health-bg:#a78bfa18;--rest:#64748b;--rest-bg:#64748b18;--money:#f472b6;--money-bg:#f472b618;--urgent:#ef4444;--urgent-bg:#ef444418}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 24px;border-bottom:1px solid var(--border);margin-bottom:24px}
.header h1{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600;letter-spacing:-0.5px}
.header h1 span{color:var(--accent)}
</style>
</head>
<body>
<div class="header"><h1><span>//</span> 14-DAY SPRINT <span>_</span></h1></div>
<p style="color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:13px;">Full schedule at <a href="https://obsidianrain.github.io/AeonFlez/" style="color:var(--accent)">AeonFlez Dashboard</a></p>
</body>
</html>
